<script id="page-content" type="application/json">{"ru":{"title":"Практики для себя","subtitle":"Четыре бережные практики. Выберите ту, которая подходит сегодня.","sections":[["Когда чувства сложно выразить словами","Арт-практика: цвет и линия","art"],["Перед началом","Найдите лист бумаги и любые материалы: карандаш, кисть, мелок. Можно выбрать только один цвет. Не нужно уметь рисовать.","art-0"],["Практика","На минуту прислушайтесь к своему состоянию. Какой линией или пятном вы могли бы его обозначить? Позвольте руке двигаться в удобном темпе. При желании добавьте второй цвет — не для красоты, а чтобы заметить изменение.","art-1"],["После","Посмотрите на лист и спросите себя: что в этом рисунке похоже на мои чувства? Что осталось за его пределами? Ничего не нужно исправлять или объяснять.","art-2"],["Если тяжело","Можно остановиться, отложить лист, посмотреть вокруг и вернуться к обычным делам. Вы сами выбираете глубину упражнения.","art-3"],["Коллекция маленьких открытий","Небольшие наблюдения без обязанности радоваться","discoveries"],["Идея","Когда жизнь требует много сил, не нужно заставлять себя испытывать благодарность или радость. Иногда достаточно заметить один небольшой момент.","discoveries-0"],["Практика","В течение дня обратите внимание на три детали: цвет, звук, запах, жест или короткую встречу. Запишите слова, сделайте рисунок или просто оставьте их в памяти.","discoveries-1"],["Вечером","Выберите одну деталь и спросите себя, почему именно она привлекла внимание. Ответа может не быть — наблюдение само по себе уже ценно.","discoveries-2"],["Важно","Это не соревнование по поиску хорошего. Если сегодня ничего не заметилось, можно попробовать в другой день.","discoveries-3"],["Моё пространство","Мягкая практика исследования личных границ","space"],["Подготовка","Возьмите лист. Нарисуйте на нём круг или любую замкнутую линию — это условное изображение пространства, в котором вам может быть спокойно.","space-0"],["Внутри","Поместите внутри слова, цвета или символы того, что хочется сохранить рядом с собой: отношения, занятия, темп, право на отдых.","space-1"],["Снаружи","За границей фигуры отметьте то, к чему вы пока не готовы или чему предпочитаете сказать «нет». Не нужно никому показывать рисунок.","space-2"],["Вопрос","Как можно позаботиться об одной из этих границ в ближайшие дни? Начните с самого небольшого шага.","space-3"],["Когда хочется на ручки","Практика маленького запроса к себе","support"],["Замечание","Иногда под усталостью скрывается не желание что-то немедленно исправлять, а потребность почувствовать заботу и опору.","support-0"],["Вопрос","Спросите себя: чего мне сейчас не хватает — тишины, разговора, отдыха, движения, ясности или простого присутствия другого человека?","support-1"],["Действие","Выберите один доступный и безопасный способ поддержать себя: чашка чая, небольшой перерыв, сообщение человеку, которому доверяете, или несколько спокойных вдохов.","support-2"],["После","Проверьте, изменилось ли что-нибудь, даже совсем немного. Если нет, это не ошибка — иногда нужна поддержка другого человека.","support-3"]]},"en":{"title":"Practices for yourself","subtitle":"Four gentle practices. Choose what feels right today.","sections":[["When feelings are hard to put into words","Art practice: colour and line","art"],["Before you begin","Find a sheet of paper and any available material: pencil, brush or crayon. One colour is enough. No drawing skill is needed.","art-0"],["The practice","Notice how you feel for a moment. What line or shape might represent that feeling? Let your hand move at its own pace. Add a second colour if you wish — not to improve the drawing, but to notice a change.","art-1"],["Afterwards","Look at the page and ask: what resembles my experience? What remains outside this picture? Nothing needs to be corrected or explained.","art-2"],["If it feels difficult","You can stop, put the page aside and return to ordinary activities. You choose how deeply to explore.","art-3"],["A collection of small discoveries","Noticing without demanding happiness","discoveries"],["The idea","When life takes a lot of energy, you do not have to force gratitude or joy. Noticing one small moment may be enough.","discoveries-0"],["The practice","During the day, notice three details: a colour, sound, smell, gesture or brief encounter. Write a few words, draw, or simply remember them.","discoveries-1"],["In the evening","Choose one detail and ask why it caught your attention. You may have no answer, and that is fine.","discoveries-2"],["Remember","This is not a competition to find the good. If nothing stood out today, another day is possible.","discoveries-3"],["My space","A gentle exploration of personal boundaries","space"],["Prepare","Draw a circle or any enclosing shape on paper. It can stand for a space where you feel safe or at ease.","space-0"],["Inside","Add words, colours or symbols of what you would like to keep close: relationships, activities, pace, permission to rest.","space-1"],["Outside","Beyond the line, mark what you are not ready for or might prefer to say no to. You do not need to show this to anyone.","space-2"],["Reflect","What is one small way to honour one of these boundaries in the coming days?","space-3"],["When you need some comfort","A small self-support practice","support"],["Notice","Sometimes beneath exhaustion there is not a need to fix everything immediately, but a wish for care and support.","support-0"],["Ask","What am I missing right now: quiet, conversation, rest, movement, clarity or someone’s presence?","support-1"],["Choose","Pick one accessible, safe act of care: a cup of tea, a short break, a message to someone you trust or a few gentle breaths.","support-2"],["Afterwards","Notice whether anything has shifted, even slightly. If not, that is not failure. Sometimes support from another person matters.","support-3"]]}}</script>
<script>(()=>{const content=JSON.parse(document.querySelector('#page-content').textContent);const E=id=>document.getElementById(id);let lang='ru';function render(l){lang=l;document.documentElement.lang=l;const t=content[l];const name=l==='ru'?'Маяк внутри':'Lighthouse Inside';E('brand').textContent=name;E('footer-brand').textContent=name;E('title').textContent=t.title;E('subtitle').textContent=t.subtitle;E('eyebrow').textContent=l==='ru'?'Библиотека поддержки':'Support library';document.title=t.title+' — '+name;E('back').textContent=l==='ru'?'← К материалам':'← Back to resources';E('resources-link').textContent=l==='ru'?'Материалы и практики':'Resources and practices';E('specialist-link').textContent=l==='ru'?'Найти специалиста':'Find a specialist';E('menu-topics').textContent=l==='ru'?'Маршруты':'Pathways';E('menu-resources').textContent=l==='ru'?'Материалы':'Resources';E('menu-individual').textContent=l==='ru'?'Индивидуально':'One-to-one';E('menu-about').textContent=l==='ru'?'О проекте':'About';E('article').innerHTML=t.sections.map((s,i)=>'<section id="'+(s[2]||'section-'+i)+'"><h2>'+s[0]+'</h2><p>'+s[1]+'</p></section>').join('')+;E('ru').setAttribute('aria-pressed',l==='ru');E('en').setAttribute('aria-pressed',l==='en');try{localStorage.setItem('beacon-lang',l)}catch(e){}}E('ru').addEventListener('click',()=>render('ru'));E('en').addEventListener('click',()=>render('en'));let first='ru';try{first=localStorage.getItem('beacon-lang')==='en'?'en':'ru'}catch(e){}render(first)})();</script></body></html>
